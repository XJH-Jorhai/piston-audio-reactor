<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1014">
  <meta name="description" content="让声谱，推动开凿。以 Minecraft 开凿机长廊为主视觉的音乐播放器。">
  <title>Assumptions — Sam Gellaitry · 开凿播放器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310151b'/%3E%3Cpath d='M9 23V9h6v14m4-10v10h5V13' fill='none' stroke='%23e2b687' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./player.css?v=player-1">
</head>
<body>
  <div class="album-backdrop" aria-hidden="true"></div><div class="backdrop-shade" aria-hidden="true"></div><div class="film-grain" aria-hidden="true"></div>
  <svg class="icon-definitions" aria-hidden="true"><defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm5 5 6 6m0-6-6 6"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-3v5a2 2 0 0 1-2 2H3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m7 8-4-4m0 0v6m0-6h6M4 14a8 8 0 1 0 3-8"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m17 8 4-4m0 0v6m0-6h-6m5 10a8 8 0 1 1-3-8"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 9a9 9 0 1 1 0 6M3 3v6h6"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="开凿播放器首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>开凿<span class="wordmark-sub">LISTENING ROOM</span></span></a>
      <span class="edition">MUSIC IN MOTION <span>VOL. 01</span></span>
      <nav class="header-actions" aria-label="播放器操作">
        <button id="import-audio" class="text-button" type="button"><svg><use href="#i-upload"/></svg><span>导入音乐</span></button>
        <button id="open-settings" class="icon-button" type="button" aria-label="播放设置" title="播放设置"><svg><use href="#i-tune"/></svg></button>
      </nav>
    </header>
    <main class="listening-room">
      <div class="scene-stage" id="scene-stage">
        <canvas id="reactor" tabindex="0" role="img" aria-label="64 台开凿机随真实音频频谱伸缩的透视长廊。拖动旋转，Shift 拖动平移。"></canvas>
        <div class="scene-corner"><span class="signal-dot"></span><span id="scene-status">声场准备中</span><span class="corner-divider"></span><span id="scene-count">64 PISTONS</span></div>
        <button id="reset-camera" class="scene-reset icon-button" type="button" aria-label="恢复播放器视角" title="恢复播放器视角"><svg><use href="#i-reset"/></svg></button>
      </div>
      <section class="track-panel" aria-label="正在播放">
        <div class="artwork-shell">
          <div class="artwork-rim" aria-hidden="true"></div>
          <button class="artwork-button" id="artwork-button" type="button" aria-label="播放 Assumptions" title="点击封面播放或暂停"><img id="cover-art" src="./assets/artwork/assumptions.jpg" alt="Sam Gellaitry · IV 专辑封面" width="500" height="500"><span class="artwork-play" aria-hidden="true"><svg><use href="#i-play"/></svg></span></button>
          <div class="cover-caption"><span id="album-label">IV</span><span>STEREO / <span id="track-number">01</span></span></div>
        </div>
        <div class="track-info"><p class="overline">NOW PLAYING</p><h1 id="track-title">Assumptions</h1><p id="track-artist">Sam Gellaitry</p></div>
        <section class="lyrics-section" aria-label="歌词">
          <div class="lyrics-heading"><span>LYRICS</span><button id="import-lyrics" type="button">载入歌词 <span aria-hidden="true">＋</span></button></div>
          <div id="lyrics-window" class="lyrics-window" tabindex="0" aria-label="滚动歌词"><div id="lyrics-empty" class="lyrics-empty"><p>此刻，只有音乐。</p><span>载入 LRC，让歌词随声音展开</span></div><div id="lyrics-lines" hidden></div></div>
        </section>
        <div class="transport" aria-label="播放控制">
          <div class="timeline"><label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="1" step=".1" value="0" disabled><div class="time-labels"><output id="elapsed">00:00</output><output id="duration">--:--</output></div></div>
          <div class="transport-buttons"><button id="repeat" class="icon-button" type="button" aria-label="单曲循环" aria-pressed="false" title="单曲循环"><svg><use href="#i-repeat"/></svg></button><div class="primary-transport"><button id="back-ten" class="seek-button" type="button" aria-label="后退10秒" title="后退10秒"><svg><use href="#i-back"/></svg><span>10</span></button><button id="play" class="play-button" type="button" aria-label="播放"><svg><use href="#i-play"/></svg></button><button id="forward-ten" class="seek-button" type="button" aria-label="前进10秒" title="前进10秒"><svg><use href="#i-forward"/></svg><span>10</span></button></div><button id="fullscreen" class="icon-button" type="button" aria-label="全屏播放" title="全屏播放"><svg><use href="#i-fullscreen"/></svg></button></div>
          <div class="volume-row"><button id="mute" class="icon-button" type="button" aria-label="静音"><svg><use href="#i-volume"/></svg></button><label for="volume" class="sr-only">音量</label><input id="volume" type="range" min="0" max="1" step=".01" value=".8"><span id="volume-value">80</span></div>
        </div>
      </section>
    </main>
    <footer class="quiet-footer"><span>让声谱，推动开凿。</span><div><span>SPACE 播放 / 暂停</span><a href="./CREDITS.md" target="_blank" rel="noopener">来源与许可 ↗</a></div></footer>
  </div>
  <audio id="audio" preload="metadata" src="./assets/audio/sam-gellaitry-assumptions.mp3"></audio>
  <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden><input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden><input id="lyrics-file" type="file" accept=".lrc,.txt,text/plain" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><div class="settings-top"><div><p class="overline">MAKE IT YOURS</p><h2 id="settings-title">播放设置</h2></div><button id="close-settings" class="icon-button" type="button" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button></div>
    <div class="settings-body">
      <section class="settings-group"><h3>歌曲与封面</h3><label class="field-label">歌曲标题<input id="edit-title" type="text" maxlength="180" value="Assumptions"></label><label class="field-label">艺术家<input id="edit-artist" type="text" maxlength="180" value="Sam Gellaitry"></label><div class="settings-actions"><button id="import-cover" type="button">更换封面</button><button id="settings-lyrics" type="button">导入歌词</button><button id="clear-lyrics" type="button">清除歌词</button></div><p class="field-note">支持音频内嵌封面，以及带时间标记的 LRC 歌词。</p></section>
      <section class="settings-group"><h3>声谱与机械行程</h3><label class="slider-label" for="band-count">频谱路数<output id="band-count-value">64</output></label><input id="band-count" type="range" min="4" max="64" step="1" value="64"><label class="slider-label" for="gain">响应强度<output id="gain-value">1.4×</output></label><input id="gain" type="range" min=".3" max="3" step=".1" value="1.4"><label class="slider-label" for="smooth">动作平滑<output id="smooth-value">55%</output></label><input id="smooth" type="range" min="0" max="95" step="1" value="55"><label class="slider-label" for="low-phase">静音姿态<output id="low-phase-value">38%</output></label><input id="low-phase" type="range" min="0" max="50" step="1" value="38"><label class="slider-label" for="high-phase">高电平姿态<output id="high-phase-value">0%</output></label><input id="high-phase" type="range" min="0" max="50" step="1" value="0"><label class="slider-label" for="response">响应曲线<output id="response-value">1.0×</output></label><input id="response" type="range" min=".25" max="4" step=".05" value="1"><p class="field-note">0% 为躯干全伸出，50% 为全收回。声音直接驱动行程。</p><button id="reset-mapping" class="reset-parameters" type="button">恢复默认声场</button></section>
    </div>
  </dialog>
  <script type="module" src="./player.js?v=player-1"></script>
</body>
</html>
